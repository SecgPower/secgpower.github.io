<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Neon Light Time</title><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#00000a;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;overflow:hidden;perspective:1500px}.radial-glow{position:absolute;width:120%;height:120%;top:-10%;left:-10%;background:radial-gradient(circle at center,rgba(76,201,240,0.15)0%,rgba(196,181,253,0.08)30%,rgba(251,113,133,0.05)60%,transparent 80%);animation:radialPulse 8s ease-in-out infinite alternate;z-index:0}.grid-curtain{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background-image:linear-gradient(rgba(76,201,240,0.12)1px,transparent 1px),linear-gradient(90deg,rgba(76,201,240,0.12)1px,transparent 1px);background-size:30px 30px;animation:gridFlow 25s linear infinite,gridScale 15s ease-in-out infinite alternate;z-index:0;opacity:0.7}.glow-spots{position:absolute;width:100%;height:100%;z-index:0;pointer-events:none}.glow-spot{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(251,113,133,0.8)0%,rgba(196,181,253,0.4)50%,transparent 100%);filter:blur(15px);opacity:0;animation:spotFlicker 4s ease-in-out infinite}.time-container{position:relative;z-index:2;text-align:center;padding:3.5rem 3rem;border-radius:16px;background:rgba(10,5,30,0.3);backdrop-filter:blur(25px);border:1px solid rgba(76,201,240,0.3);box-shadow:0 0 50px rgba(76,201,240,0.2),0 0 80px rgba(196,181,253,0.15),0 0 120px rgba(251,113,133,0.1),inset 0 0 30px rgba(76,201,240,0.1);animation:containerFloat 10s ease-in-out infinite,containerTilt 15s ease-in-out infinite alternate,containerGlow 6s ease-in-out infinite alternate}#time{font-size:clamp(5.5rem,22vw,13rem);font-weight:900;letter-spacing:-0.01em;line-height:1.1;background:linear-gradient(45deg,#4cc9f0,#c4b5fd,#fb7185,#4cc9f0);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(76,201,240,0.5),0 0 60px rgba(196,181,253,0.4),0 0 100px rgba(251,113,133,0.3);animation:textGradientFlow 8s ease infinite,textGlowPulse 4s ease-in-out infinite alternate}#date{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:300;color:#e0e7ff;text-transform:uppercase;letter-spacing:0.2em;margin-top:1.5rem;text-shadow:0 0 15px rgba(76,201,240,0.3);animation:dateFloat 12s ease-in-out infinite alternate,dateFade 6s ease-in-out infinite alternate}.tip{position:absolute;bottom:3.5rem;font-size:1.1rem;color:#a5b4fc;font-weight:200;letter-spacing:0.15em;z-index:2;text-shadow:0 0 10px rgba(196,181,253,0.2);animation:tipGlow 5s ease-in-out infinite alternate,tipFloat 14s ease-in-out infinite alternate}@keyframes radialPulse{from{transform:scale(1);opacity:0.6}to{transform:scale(1.2);opacity:0.9}}@keyframes gridFlow{0%{background-position:0 0}100%{background-position:600px 600px}}@keyframes gridScale{from{transform:scale(1)}to{transform:scale(1.1)}}@keyframes spotFlicker{0%,100%{opacity:0;transform:scale(0.8)}50%{opacity:0.3;transform:scale(1.2)}}@keyframes containerFloat{0%,100%{transform:translateZ(0) translateY(0)}25%{transform:translateZ(30px) translateY(-15px)}50%{transform:translateZ(0) translateY(-5px)}75%{transform:translateZ(20px) translateY(-10px)}}@keyframes containerTilt{from{transform:rotateX(5deg) rotateY(-5deg)}to{transform:rotateX(-5deg) rotateY(5deg)}}@keyframes containerGlow{from{box-shadow:0 0 50px rgba(76,201,240,0.2),0 0 80px rgba(196,181,253,0.15),0 0 120px rgba(251,113,133,0.1),inset 0 0 30px rgba(76,201,240,0.1)}to{box-shadow:0 0 70px rgba(76,201,240,0.3),0 0 110px rgba(196,181,253,0.25),0 0 150px rgba(251,113,133,0.2),inset 0 0 40px rgba(76,201,240,0.2)}}@keyframes textGradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes textGlowPulse{from{text-shadow:0 0 30px rgba(76,201,240,0.5),0 0 60px rgba(196,181,253,0.4),0 0 100px rgba(251,113,133,0.3)}to{text-shadow:0 0 40px rgba(76,201,240,0.7),0 0 80px rgba(196,181,253,0.6),0 0 130px rgba(251,113,133,0.5)}}@keyframes dateFloat{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(15px) translateY(-5px)}}@keyframes dateFade{from{opacity:0.7;text-shadow:0 0 15px rgba(76,201,240,0.3)}to{opacity:1;text-shadow:0 0 25px rgba(76,201,240,0.5)}}@keyframes tipGlow{from{color:#a5b4fc;text-shadow:0 0 10px rgba(196,181,253,0.2)}to{color:#c4b5fd;text-shadow:0 0 20px rgba(196,181,253,0.4)}}@keyframes tipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap');</style></head><body><div class="radial-glow"></div><div class="grid-curtain"></div><div class="glow-spots" id="glow-spots"></div><div class="time-container"><div id="time"></div><div id="date"></div></div><div class="tip">CYBER GLOW ACTIVATED | HIGH-INTENSITY LIGHT MODE</div><script>function updateTime(){const e=new Date;let t=String(e.getHours()).padStart(2,"0"),n=String(e.getMinutes()).padStart(2,"0"),i=String(e.getSeconds()).padStart(2,"0");document.getElementById("time").textContent=`${t}:${n}:${i}`;const o={weekday:"long",year:"numeric",month:"short",day:"numeric"},a=e.toLocaleDateString("en-US",o).toUpperCase();document.getElementById("date").textContent=a}updateTime(),setInterval(updateTime,1e3);function createGlowSpots(){const e=document.getElementById("glow-spots");for(let t=0;t<15;t++){const n=document.createElement("div");n.className="glow-spot";const i=Math.random()*150+80,o=Math.random()*100,a=Math.random()*100,d=Math.random()*5;n.style.cssText=`width:${i}px;height:${i}px;left:${o}%;top:${a}%;animation-delay:${d}s`;e.appendChild(n)}}createGlowSpots();</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP下载 | SecgPower的项目中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#69B1FF',
                        dark: '#1F2937',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-inter text-dark bg-gray-50">
    <!-- 导航栏 -->
    <header id="navbar" class="fixed w-full top-0 z-50 bg-white shadow-md py-3">
        <div class="container mx-auto px-4 md:px-8 flex justify-between items-center">
            <div class="flex items-center">
                <div class="w-12 h-12 relative mr-3">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <path d="M20,20 L80,20 L80,80 L20,80 Z" fill="none" stroke="#165DFF" stroke-width="2"/>
                        <path d="M20,20 L80,80" fill="none" stroke="#165DFF" stroke-width="2"/>
                        <path d="M80,20 L20,80" fill="none" stroke="#165DFF" stroke-width="2"/>
                    </svg>
                </div>
                <h1 class="text-xl md:text-2xl font-bold text-primary">Secg<span class="text-dark">Power的个人页面</span></h1>
            </div>
            <nav class="hidden md:flex space-x-8">
                <a href="/" class="text-dark hover:text-primary transition-colors duration-300">首页</a>
                <a href="/docs/" class="text-dark hover:text-primary transition-colors duration-300">文档</a>
                <a href="/projects/" class="text-dark hover:text-primary transition-colors duration-300">产品</a>
                <a href="/app-download/" class="text-primary font-medium">APP下载</a>
            </nav>
            <button id="menu-toggle" class="md:hidden text-dark focus:outline-none">
                <<i class="fa fa-bars text-2xl"></</i>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white shadow-lg absolute w-full py-4 px-4">
            <nav class="flex flex-col space-y-4">
                <a href="/" class="text-dark hover:text-primary transition-colors duration-300 py-2 border-b border-gray-100">首页</a>
                <a href="/docs/" class="text-dark hover:text-primary transition-colors duration-300 py-2 border-b border-gray-100">文档</a>
                <a href="/projects/" class="text-dark hover:text-primary transition-colors duration-300 py-2 border-b border-gray-100">产品</a>
                <a href="/r18/apps/" class="text-primary py-2">APP下载</a>
            </nav>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 md:px-8 pt-32 pb-20">
        <div class="max-w-4xl mx-auto">
            <!-- 标题区 -->
            <div class="text-center mb-16 opacity-0" data-scroll-animate>
                <h2 class="text-[clamp(2rem,4vw,3rem)] font-bold mb-4">r18-APP<span class="text-primary">下载</span></h2>
                <p class="text-gray-600 max-w-2xl mx-auto">点击下方按钮即可直接下载对应APP，建议在下载后检查文件完整性</p>
            </div>

            <!-- APP下载列表 -->
            <div class="space-y-6 opacity-0" data-scroll-animate>
                <!-- JMComic -->
                <div class="bg-white rounded-xl shadow-sm p-8 flex flex-col md:flex-row justify-between items-center">
                    <div>
                        <h3 class="text-2xl font-semibold mb-2">JMComic</h3>
                        <p class="text-gray-600">点击按钮开始下载APK文件，下载后安装前请先合并两个文件</p>
                    </div>
                    <a href="/projects/dl/jmcomic.apk.0" class="mt-4 md:mt-0 px-8 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors duration-300 inline-flex items-center">
                        <<i class="fa fa-download mr-2"></</i> part1下载
                    </a>
                    <a href="/projects/dl/jmcomic.apk.1" class="mt-4 md:mt-0 px-8 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors duration-300 inline-flex items-center">
                        <<i class="fa fa-download mr-2"></</i> part2下载
                    </a>
                </div>

                <!-- PicACG -->
                <div class="bg-white rounded-xl shadow-sm p-8 flex flex-col md:flex-row justify-between items-center">
                    <div>
                        <h3 class="text-2xl font-semibold mb-2">PicACG</h3>
                        <p class="text-gray-600">点击按钮开始下载APK文件</p>
                    </div>
                    <a href="/projects/dl/picacg.apk" class="mt-4 md:mt-0 px-8 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors duration-300 inline-flex items-center">
                        <<i class="fa fa-download mr-2"></</i> 立即下载
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-12">
        <div class="container mx-auto px-4 md:px-8">
            <div class="text-center">
                <p class="text-gray-400 text-sm">SecgPower 保留所有权利。下载前请确认遵守相关法律法规，文件安全性请自行核查</p>
            </div>
        </div>
    </footer>

    <script>
        // 移动端菜单切换
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // 滚动动画
        const scrollElements = document.querySelectorAll('[data-scroll-animate]');
        const elementInView = (el) => {
            const elementTop = el.getBoundingClientRect().top;
            return elementTop <= (window.innerHeight || document.documentElement.clientHeight) / 1.25;
        };
        const displayScrollElement = (element) => {
            element.classList.add('animate-fade-in');
            element.classList.remove('opacity-0');
        };
        const handleScrollAnimation = () => {
            scrollElements.forEach(el => {
                if (elementInView(el)) displayScrollElement(el);
            });
        };
        window.addEventListener('scroll', handleScrollAnimation);
        handleScrollAnimation(); // 初始检查
    </script>
</body>
</html>

name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generate sitemap.xml for static HTML
        run: |
          # 创建Python脚本，遍历HTML文件生成sitemap
          cat > generate_sitemap.py << 'EOF'
          import os
          from xml.etree import ElementTree as ET

          # 配置：替换为你的GitHub Pages域名（如 https://username.github.io/repo）
          BASE_URL = "https://secgpower.github.io"
          # 网站根目录（当前workflow的根目录，无需改）
          ROOT_DIR = "."
          # 要排除的目录（如node_modules、_site等，按需添加）
          EXCLUDE_DIRS = ["node_modules", ".git", "_site", "r18"]

          # 创建XML根节点
          urlset = ET.Element("urlset", xmlns="http://www.sitemaps.org/schemas/sitemap/0.9")

          # 遍历所有HTML文件
          for dirpath, dirnames, filenames in os.walk(ROOT_DIR):
              # 跳过排除目录
              dirnames[:] = [d for d in dirnames if d not in EXCLUDE_DIRS]
              for filename in filenames:
                  if filename.endswith(".html"):
                      # 拼接文件路径，生成URL
                      file_path = os.path.join(dirpath, filename)
                      # 转换为相对路径（相对于根目录）
                      rel_path = os.path.relpath(file_path, ROOT_DIR)
                      # 生成完整URL（处理index.html，简化为目录形式）
                      if rel_path == "index.html":
                          url = BASE_URL + "/"
                      else:
                          url = f"{BASE_URL}/{rel_path.replace(os.sep, '/')}"
                      # 添加到XML
                      url_elem = ET.SubElement(urlset, "url")
                      loc_elem = ET.SubElement(url_elem, "loc")
                      loc_elem.text = url

          # 保存sitemap.xml到根目录
          tree = ET.ElementTree(urlset)
          ET.indent(tree, space="  ")
          tree.write("sitemap.xml", encoding="utf-8", xml_declaration=True)
          print("sitemap.xml generated successfully!")
          EOF
          # 运行Python脚本生成sitemap
          python3 generate_sitemap.py
        env:
          # 这里替换为你的GitHub Pages实际域名，不要带最后的斜杠
          BASE_URL: "https://secgpower.github.io"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # 上传整个仓库（含新生成的sitemap.xml）

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
